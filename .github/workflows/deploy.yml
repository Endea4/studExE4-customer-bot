name: Deploy to izcy-engine

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o cbot ./cmd

      # Ships the binary to the exact bind-mounted path for the "cbot" service
      # and restarts only that one container. Never touches the compose file,
      # any other service, or any other app on the shared host.
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # scp to a temp name first: the target path is a running binary,
          # and opening it directly for write fails with ETXTBSY. rename is
          # atomic and works fine while the old inode is still executing.
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            cbot "$SSH_USER@$SSH_HOST:/home/AgentZcy/endea4-services/cbot.new"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "chmod +x /home/AgentZcy/endea4-services/cbot.new && \
             mv /home/AgentZcy/endea4-services/cbot.new /home/AgentZcy/endea4-services/cbot && \
             docker compose -f /home/AgentZcy/endea4-docker/docker-compose.yml restart cbot"
